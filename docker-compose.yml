services:
  victim-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: watcher-victim-api:local
    container_name: watcher-victim-api
    restart: always
    ports:
      - "18080:8080"
    environment:
      VICTIM_PORT: "8080"
      VICTIM_API_KEY: "${VICTIM_API_KEY:-0123456789abcdef0123456789abcdef}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
